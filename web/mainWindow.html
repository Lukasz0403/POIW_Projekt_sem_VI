<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>MyParts - Panel</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        /* NAVBAR */
        .navbar {
            width: 100%;
            background: #cc0000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            box-sizing: border-box;
            height: 60px;
            color: white;
        }

        .nav-left {
            display: flex;
            gap: 20px;
        }

        .nav-left a {
            color: white;
            text-decoration: none;
            font-weight: bold;
            cursor: pointer;
        }

        .nav-left a:hover {
            text-decoration: underline;
        }

        .logout {
            cursor: pointer;
            font-weight: bold;
        }

        .logout:hover {
            text-decoration: underline;
        }

        /* CONTENT */
        .content {
            padding: 30px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            max-width: 600px;
        }
        
        .products-container {
            display: flex;
        }

        .sidebar {
            width: 250px;
            background: #e0e0e0;
            padding: 15px;
        }

        .table-container {
            flex: 1;
            padding: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: left;
        }
        
        
    </style>
</head>
<body>

<div class="navbar">
    <div class="nav-left">
        <a onclick="go('dashboard')">Dashboard</a>
        <a onclick="go('products')">Produkty</a>
        <a onclick="go('orders')">Przyjęcie Zamówienia</a>
        <a onclick="go('sale')">Kasa fiskalna</a>
        <a onclick="go('raport')">Raport sprzedażowy</a>
    </div>

    <div class="logout" onclick="logout()">
        Wyloguj
    </div>
</div>

<div class="content", id="content">
    <div class="card">
        <h2>Witaj w MyParts 🚗</h2>
        <p>To jest główne okno aplikacji. </p>
    </div>
</div>

<script src="scripts.js">
   
</script>

<script>
    window.onload = function() {
        go("dashboard");
    }
</script>

</body>
</html>
