<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>MyParts - Przyjęcie zamówienia</title>

    <link rel="stylesheet" href="../styles/style.css">
    <link rel="stylesheet" href="../styles/styleOrders.css">
</head>
<body>
<main>

    <h1>Przyjęcie zamówienia</h1>

    <div class="orders-grid">

        <!-- 🔹 FORMULARZ POJEDYNCZY -->
        <div class="card">

            <h3>Dodaj produkt</h3>

            <label for="prod_name">Nazwa:</label>
            <input type="text" id="prod_name">
            <span class="error-msg" id="err_name">Pole nie może być puste</span>

            <label for="prod_brand">Marka:</label>
            <input type="text" id="prod_brand">
            <span class="error-msg" id="err_brand">Pole nie może być puste</span>

            <label for="prod_category">Kategoria:</label>
            <select id="prod_category">
                <option value="">-- wybierz --</option>
            </select><br>

            <label for="prod_price">Cena:</label>
            <input type="number" id="prod_price" min="0" step="0.01">
            <span class="error-msg" id="err_price">Błąd w formularzu</span>

            <label for="prod_quantity">Ilość:</label>
            <input type="number" id="prod_quantity" min="1">
            <span class="error-msg" id="err_quantity">Błąd w formularzu</span>

            <button onclick="addProduct()">Dodaj produkt</button>

        </div>

        <!-- 🔹 IMPORT CSV -->
        <div class="card">

            <h3>Import z pliku CSV</h3>

            <label for="csv_file" class="file-label">Wybierz plik CSV:</label>
            <input type="file" id="csv_file" accept=".csv">
            
            <div class="csv-hint">
                <p>Plik CSV powinien mieć następującą strukturę:</p>
                <code>nazwa;marka;kategoria;cena;ilosc</code>
                <p>Przykład:</p>
                <code>Filtr oleju;Bosch;Filtry;45.50;30</code>
            </div>

            <button onclick="uploadCSV()">Importuj</button>

        </div>

    </div>

</main>

<script src="../scripts/script.js"></script>
<script src="../scripts/orders.js"></script>

</body>
</html>
