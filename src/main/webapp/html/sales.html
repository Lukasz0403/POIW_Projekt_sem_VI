<!DOCTYPE html>
<html lang="pl">
    <head>
        <meta charset="UTF-8">
        <title>MyParts - Kasa Fiskalna</title>
        <link rel="stylesheet" href="../styles/style.css">
        <link rel="stylesheet" href="../styles/styleSales.css">
    </head>
    <body>
    <div id="navbar-placeholder"></div>

    <div class="sales-page-container">
        <div class="cart-panel">
            <h2>Lista artykułów do sprzedaży</h2>
            <hr>
            <ul id="cart-list" style="list-style: none; padding: 0;"></ul>
            
            <div class="total-section">
                Sumaryczna kwota: <span id="total-price">0.00</span> PLN
            </div>

            <button id="finalize-sale-btn" class="finalize-button" style="display:none;">Zatwierdź sprzedaż</button>
        </div>

        <div class="form-panel">
            <h1>Kasa Fiskalna</h1>
            
            <div class="input-group">
                <label>Wybierz produkt:</label>
                <input list="products-list" id="selected-product-info" placeholder="Wyszukaj produkt">
                <datalist id="products-list"></datalist>
            </div>

            <div class="input-group">
                <label>Ilość:</label>
                <input type="number" id="prod_qty" value="1" min="1">
            </div>

            <button id="add-to-cart-btn" class="ok-button">Dodaj do paragonu</button>
        </div>
    </div>
        <script src="../scripts/script.js"></script>
        <script src="../scripts/sales.js"></script>
    </body>
</html>
