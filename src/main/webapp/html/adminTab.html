<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <!-- Tytuł strony panelu głównego -->
    <title>MyParts - Pracownicy</title>
    <!-- Podłączenie stylów CSS -->
    <link rel="stylesheet" href="../styles/style.css">
    <link rel="stylesheet" href="../styles/styleAdmin.css">
</head>
<body>
    <!-- Główna zawartość strony (dynamicznie zmieniana przez JS) -->
    <main>
        <div class="card-container">
            <div class="card">
                <h3>Dodaj pracownika</h3>
                <form onsubmit="event.preventDefault(); addUser()">
                    <label class="role" for="rol">Uprawnienia:</label>
                    <select class="role" id="rol">
                        <option value="1" selected>pracownik</option>
                        <option value="2">kierownik</option>
                        <option value="3">administrator</option>
                    </select>
                    <label for="login">Nazwa użytkownika (Minimum 4 znaki):</label>
                    <input type="text" placeholder="login" id="login" pattern="\S{4,}" required>
                    <label for="pass">Hasło (Minimum 8 znaków):</label>
                    <input type="password" placeholder="hasło" id="pass" pattern="\S{8,}" required>
                    <button>Potwierdź</button>
                </form>

            </div>
            <div class="card table-card">
                <table>
                    <thead>
                        <th id="idSort" onclick="idSort()">Identyfikator<span>&#8595;</span></th>
                        <th id="loginSort" onclick="nameSort()">Login<span>&#8595;</span></th>
                        <th>Uprawnienia</th>
                        <th>Edytuj</th>
                    </thead>
                    <tbody id="tbody">
                    </tbody>
                </table>
            </div>
            <div class="card">
                <h3>Filtry</h3>
                <label class="filterRole" for="roleFilter">Uprawnienia:</label>
                <select class="filterRole" id="roleFilter">
                    <option value="">wszyscy</option>
                    <option value="pracownik">pracownik</option>
                    <option value="kierownik">kierownik</option>
                    <option value="administrator">administrator</option>
                </select>
                <label for="loginFilter">Nazwa użytkownika:</label>
                <input id="loginFilter">
                <label for="userId">Identyfikator:</label>
                <input type="number" min="1" id="userId">
            </div>
        </div>

    </main>
    <!-- Podłączenie pliku JavaScript (logika aplikacji) -->
    <script src="../scripts/script.js"></script>
    <script src="../scripts/adminTab.js"></script>
</body>
</html>
