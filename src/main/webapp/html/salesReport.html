<!DOCTYPE html>
<html lang="pl">
    <head>
        <meta charset="UTF-8">
        <title>MyParts - Archiwum</title>
        <link rel="stylesheet" href="../styles/style.css">
        <link rel="stylesheet" href="../styles/styleReport.css">
    </head>
    <body>
        <aside class="sidebar">
            <h3>Filtry</h3>
            <label for="kategoria">Kategoria:</label>
            <select id="kategoria">
                <option value="">-- wszystkie --</option>
            </select><br><br>
            <label for="search_name">Nazwa produktu:</label>
            <input type="text" id="search_name"><br><br>
        </aside>

        <main class="content">
            <div class="products-header">
                <h2>Transakcje</h2>
            </div>

            <table>
                <thead>
                    <tr>
                        <th id="th_category" onclick="columnSort('category')">Kategoria <span>↕</span></th>
                        <th id="th_name" onclick="columnSort('name')">Nazwa <span>↕</span></th>
                        <th id="th_brand" onclick="columnSort('brand')">Marka <span>↕</span></th>
                        <th id="th_price" onclick="columnSort('price')">Cena <span>↕</span></th>
                        <th id="th_quantity" onclick="columnSort('quantity')">Ilość <span>↕</span></th>
                        <th id="th_date" onclick="columnSort('date')">Data Sprzedaży <span>↕</span></th>
                        <th>Szczegóły</th>
                    </tr>
                </thead>
                <tbody id="products_table"></tbody>
            </table>
            <p id="sales_counter" class="counter"></p>
        </main>

        <script src="../scripts/script.js"></script>
        <script src="../scripts/salesReport.js"></script>
    </body>
</html>
